<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Night of Nights</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            cursor: pointer;
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <audio id="bgm" src="真っ黒ナイト・オブ・ナイツ.wav" loop></audio>
    <script>
        const bgm = document.getElementById('bgm');
        if ('mediaSession' in navigator) {
            navigator.mediaSession.metadata = new MediaMetadata({ title: 'ナイト・オブ・ナイツ' });
        }
        document.body.addEventListener('click', () => {
            if (bgm.paused) { bgm.play().catch(e => console.log(e)); }
        });
    </script>
</body>
</html>
